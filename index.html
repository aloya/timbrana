<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbrana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 24px;
    }

    .logo {
    display: block;
    width: min(44vw, 380px);
    height: auto;
    }

    @media (max-width: 600px) {
    .logo {
      width: 47vw;
      max-width: 380px;
    }
  }
  </style>
</head>

<body>
  <img
    src="./timbrana-logo.svg"
    alt="Timbrana"
    class="logo"
  />
</body>
</html>
